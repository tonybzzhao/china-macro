name: Update China macro data

on:
  schedule:
    # Hourly, offset to :23 rather than the top of the hour. GitHub's own
    # docs warn that ":00" is the most congested slot on their scheduler
    # and jobs there "may be delayed or, in some cases, dropped" — that's
    # exactly what happened here: only 1 run fired in ~8 hours on "0 * * * *".
    # Most series (GDP/CPI/PMI/etc.) are monthly/quarterly releases and
    # won't change most hours — this just means a new release shows up
    # within an hour instead of within a day. News and USD/CNY are the two
    # series that actually benefit every run.
    - cron: "23 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "china-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/history.json; then
            echo "No data changes."
          else
            git add data/history.json
            git commit -m "Auto-update macro data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
