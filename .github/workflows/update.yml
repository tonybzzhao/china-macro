name: Update China macro data

on:
  schedule:
    # 01:00 UTC = 09:00 Beijing — after most NBS/PBOC morning releases
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "china-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/history.json; then
            echo "No data changes."
          else
            git add data/history.json
            git commit -m "Auto-update macro data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
