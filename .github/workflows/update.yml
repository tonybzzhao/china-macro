name: Update China macro data

on:
  schedule:
    # Hourly, on the hour. Most series (GDP/CPI/PMI/etc.) are monthly/
    # quarterly releases and won't change most hours — this just means a
    # new release shows up within an hour instead of within a day. News
    # and USD/CNY are the two series that actually benefit every run.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run update script
        run: python scripts/update_data.py

      - name: Commit and push if changed
        run: |
          git config user.name "china-macro-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- data/history.json; then
            echo "No data changes."
          else
            git add data/history.json
            git commit -m "Auto-update macro data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
