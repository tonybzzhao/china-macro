<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>China Macro Pulse</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<link rel="stylesheet" href="style.css">
<script>
// Runs synchronously before first paint so the stored theme choice never flashes.
(function () {
  try {
    var t = localStorage.getItem("theme");
    if (t === "light" || t === "dark") document.documentElement.setAttribute("data-theme", t);
  } catch (e) {}
})();
</script>
</head>
<body>
<div class="wrap">

  <div class="masthead">
    <div>
      <h1 class="logo-wrap">
        <img src="assets/logo-light.svg" alt="China Macro Pulse" class="logo logo-light">
        <img src="assets/logo-dark.svg" alt="China Macro Pulse" class="logo logo-dark">
      </h1>
      <p class="sub">Growth, prices, credit, trade, property and labor — refreshed automatically from official releases and market data.</p>
    </div>
    <div class="asof">
      <div class="masthead-controls">
        <div class="theme-switch" id="theme-switch" role="group" aria-label="Theme">
          <button class="theme-btn" data-theme-choice="light" title="Light" aria-label="Light theme">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="3.5" stroke="currentColor" stroke-width="1.5"/><path d="M8 1v2M8 13v2M2.6 2.6l1.4 1.4M12 12l1.4 1.4M1 8h2M13 8h2M2.6 13.4L4 12M12 4l1.4-1.4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <button class="theme-btn" data-theme-choice="dark" title="Dark" aria-label="Dark theme">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M13.5 9.5A5.5 5.5 0 0 1 6.5 2.5 5.5 5.5 0 1 0 13.5 9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          </button>
          <button class="theme-btn" data-theme-choice="system" title="Match system" aria-label="System theme">
            <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="9" rx="1.2" stroke="currentColor" stroke-width="1.5"/><path d="M5.5 14h5M8 11.5V14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
        </div>
      </div>
      <div class="beijing-clock" title="Shanghai/Shenzhen exchange hours (9:30–11:30, 13:00–15:00 CST), using the actual exchange trading calendar — including holidays and substitute workdays">
        <span id="beijing-time">--:--:--</span> CST
        <span id="market-status" class="market-badge"><span class="market-dot"></span><span class="market-label">—</span></span>
      </div>
      <div><span class="live-dot"></span>Auto-updated on a schedule</div>
      <div>Data as of <strong id="asof-date">—</strong></div>
    </div>
  </div>

  <div class="filter-row">
    <div class="range-group" id="range-group">
      <button class="range-btn" data-range="6">6M</button>
      <button class="range-btn active" data-range="12">1Y</button>
      <button class="range-btn" data-range="24">2Y</button>
      <button class="range-btn" data-range="0">All</button>
    </div>
    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.6"/><path d="M11 11l3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input type="search" id="search-input" class="search-input" placeholder="Search indicators…" aria-label="Search indicators">
    </div>
  </div>

  <div class="layout">
    <div class="main-col">

      <div class="tabs" id="tabs" role="tablist">
        <button class="tab active" data-cat="growth" role="tab">
          <svg class="tab-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.5 13.5 6 8l3 3 5.5-6.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M11 4.5h3.5V8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Growth &amp; Activity
        </button>
        <button class="tab" data-cat="prices_credit" role="tab">
          <svg class="tab-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M5.3 4.5 8 8.3 10.7 4.5M8 8.3v4M5.3 9.3h5.4M5.3 10.8h5.4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
          Prices &amp; Credit
        </button>
        <button class="tab" data-cat="external" role="tab">
          <svg class="tab-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="6" stroke="currentColor" stroke-width="1.6"/><path d="M2 8h12M8 2c1.8 1.7 2.8 3.8 2.8 6S9.8 12.3 8 14c-1.8-1.7-2.8-3.8-2.8-6S6.2 3.7 8 2Z" stroke="currentColor" stroke-width="1.4"/></svg>
          External Sector
        </button>
        <button class="tab" data-cat="property_labor" role="tab">
          <svg class="tab-icon" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M2.5 14V6.2L8 2l5.5 4.2V14" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="M6 14v-4h4v4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg>
          Property &amp; Labor
        </button>
      </div>

      <div id="panels"></div>

    </div>

    <aside class="news-rail">
      <h2 class="news-heading">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="2.5" width="13" height="11" rx="1.2" stroke="currentColor" stroke-width="1.5"/><path d="M4 5.5h8M4 8h8M4 10.5h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        Top News
      </h2>
      <div id="news-list"></div>
    </aside>
  </div>

  <footer id="footer-sources">
    Loading source information…
  </footer>

  <div class="credit-row">
    <span class="credit-text">Created by Tony Zhao</span>
    <div class="credit-links">
      <a href="mailto:bz2746@nyu.edu" class="credit-btn credit-email" title="Email" aria-label="Email Tony Zhao">
        <svg viewBox="0 0 16 16" fill="none" aria-hidden="true"><rect x="1.5" y="3" width="13" height="10" rx="1.5" stroke="currentColor" stroke-width="1.4"/><path d="M2 4.3 8 9l6-4.7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </a>
      <a href="https://www.linkedin.com/in/tonybzhao/" target="_blank" rel="noopener noreferrer" class="credit-btn credit-linkedin" title="LinkedIn" aria-label="Tony Zhao on LinkedIn">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M4.98 3.5C4.98 4.88 3.87 6 2.49 6S0 4.88 0 3.5 1.12 1 2.49 1s2.49 1.12 2.49 2.5zM.5 8.5h4V24h-4V8.5zM8.5 8.5h3.8v2.1h.05c.53-1 1.83-2.1 3.77-2.1C20.5 8.5 22 11 22 15.1V24h-4v-8c0-2-.04-4.6-2.8-4.6-2.8 0-3.23 2.2-3.23 4.45V24h-4V8.5z"/></svg>
      </a>
      <a href="https://tonybzhao.substack.com/" target="_blank" rel="noopener noreferrer" class="credit-btn credit-substack" title="Substack" aria-label="Tony Zhao on Substack">
        <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M2 2h12v2.1H2V2Zm0 3.5h12v2.1H2V5.5ZM2 9h12v5.3L8 11.1 2 14.3V9Z"/></svg>
      </a>
    </div>
  </div>

</div>

<script src="app.js"></script>
</body>
</html>
